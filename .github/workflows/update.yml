name: Update stats

on:
  schedule:
    - cron: '17 * * * *'   # hourly
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # force-push the data branch
  pages: write
  id-token: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Everything accumulated so far lives on the `data` branch as a single
      # commit, so the repository's history doesn't grow with every run.
      - name: Restore accumulated data
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git clone --quiet --depth 1 --branch data \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" databranch
            rm -rf databranch/.git
          else
            mkdir -p databranch
          fi

      - name: Scrape game.battlecode.au
        run: node scraper/scrape.mjs --state databranch/state --out databranch/public

      - name: Save accumulated data
        run: |
          cd databranch
          git init -q -b data
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Data snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: Assemble site
        run: rm -rf site/data && cp -R databranch/public site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
