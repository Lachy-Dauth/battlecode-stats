<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battlecode Stats</title>
  <meta name="description" content="Unofficial stats for UNSW Battlecode 2026: ranked leaderboard, Elo history, per-map Elo, submission history, matchup odds and tournament simulations.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M7 22l6-7 5 4 7-10' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>
    try { const t = localStorage.getItem('bcs.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="#/"><span class="logo" aria-hidden="true"></span>Battlecode&nbsp;Stats</a>
      <nav class="nav" aria-label="Sections">
        <a href="#/" data-nav="leaderboard">Leaderboard</a>
        <a href="#/maps" data-nav="maps">Maps</a>
        <a href="#/odds" data-nav="odds">Odds</a>
        <a href="#/bracket" data-nav="bracket">Bracket</a>
        <a href="#/matchup" data-nav="matchup">Matchup</a>
        <a href="#/battles" data-nav="battles">Battles</a>
        <a href="#/stats" data-nav="stats">Stats</a>
        <a href="#/about" data-nav="about">About</a>
      </nav>
      <div class="top-right">
        <label class="myteam" title="Pick your team to see who you can challenge and your odds against them">
          <span class="muted">My team</span>
          <input id="myteam" list="teamlist" placeholder="Your team…" autocomplete="off" spellcheck="false">
        </label>
        <button id="theme" class="icon-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">◐</button>
      </div>
    </div>
  </header>
  <datalist id="teamlist"></datalist>
  <main id="main" class="wrap" tabindex="-1">
    <p class="muted loading">Loading data…</p>
  </main>
  <footer class="wrap foot muted">
    <span id="updated"></span>
    <span>Unofficial fan site. Data from <a href="https://game.battlecode.au" rel="noopener">game.battlecode.au</a>.</span>
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
